[package]
name = "tokker-api"
description = "Tokker's Cratefield harness modules — the pricing API and MCP surface"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
# float_roundtrip: a stored row's numbers must re-serialise unchanged.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sea-query = { workspace = true }

[dev-dependencies]
cratefield-adapter-sqlite = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
