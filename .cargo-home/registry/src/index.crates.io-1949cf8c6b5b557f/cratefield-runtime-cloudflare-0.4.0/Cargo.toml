[package]
edition = "2024"
rust-version = "1.98"
name = "cratefield-runtime-cloudflare"
version = "0.4.0"
build = false
include = [
    "src/**/*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cloudflare Workers runtime for the Cratefield harness (workers-rs)"
readme = "README.md"
keywords = [
    "cratefield",
    "cloudflare",
    "workers",
    "wasm",
    "serverless",
]
categories = ["web-programming"]
license = "MIT"
repository = "https://github.com/Cratefield/harness"

[features]
