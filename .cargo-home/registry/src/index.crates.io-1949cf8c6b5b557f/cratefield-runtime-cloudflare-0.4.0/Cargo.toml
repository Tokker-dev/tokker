[dependencies.bytes]
version = "1.12.1"

[dependencies.cratefield-auth-client]
version = "0.3"

[dependencies.cratefield-core]
version = "0.8"

[dependencies.cratefield-push-wiring]
version = "0.3"
optional = true

[dependencies.futures-core]
version = "0.3.34"

[dependencies.futures-util]
version = "0.3.34"
