[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Tokker-dev/tokker"

[workspace.dependencies]
# All cratefield-* crates come from crates.io, pinned to compatible
# versions. Never mix sources; `cargo tree -d --depth 0 | grep cratefield`
# must print nothing (CLAUDE.md).
cratefield-core = "0.10.1"
cratefield-runtime-cloudflare = "0.5.3"

# Test-only: the rusqlite-backed Database port (bundled SQLite) the route
# tests run real SQL through. Pinned: 0.3.1 moved to cratefield-core 0.9,
# and the workspace stays on 0.8 (CLAUDE.md: one cratefield source).
cratefield-adapter-sqlite = "=0.3.3"

# HTTP stack (versions aligned with what cratefield-core re-exports).
axum = { version = "0.8", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-query = "0.32"

# Workers runtime.
worker = { version = "0.8", default-features = false, features = ["d1"] }
async-trait = "0.1"

# Test-only.
tokio = { version = "1", features = ["rt", "macros"] }
tower = "0.5"

# wasm32-only: getrandom needs the opt-in wasm_js backend.
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
must_use_candidate = { level = "allow", priority = 1 }
